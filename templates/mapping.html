<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站名归一 · 地铁首程客流</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
         margin: 0; background: #f4f6f8; color: #1f2933; }
  header { background: #0f4c81; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  main { max-width: 960px; margin: 24px auto; padding: 0 16px;
         display: grid; gap: 20px; }
  section { background: #fff; border-radius: 10px; padding: 20px 24px;
            box-shadow: 0 1px 3px rgba(15, 76, 129, .12); }
  h2 { margin: 0 0 12px; font-size: 17px; color: #0f4c81; }
  label { display: block; font-size: 13px; margin: 10px 0 4px; color: #52606d; }
  input[type=file] { width: 100%; padding: 8px; border: 1px solid #cbd2d9;
                     border-radius: 6px; font-size: 14px; background: #fff; }
  button { margin-top: 14px; padding: 9px 22px; border: 0; border-radius: 6px;
           background: #0f4c81; color: #fff; font-size: 14px; cursor: pointer; }
  button:hover { background: #0b3a63; }
  button:disabled { background: #9fb3c8; cursor: not-allowed; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 14px;
         display: none; white-space: pre-wrap; }
  .msg.ok  { display: block; background: #e3f2e9; color: #1c6b3c; }
  .msg.err { display: block; background: #fdecea; color: #b3261e; }
  .badges { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .badge { background: #eef2f6; border-radius: 999px; padding: 5px 14px;
           font-size: 13px; color: #334e68; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #e4e7eb; }
  th { color: #52606d; font-weight: 600; }
  .muted { color: #7b8794; }
  .hint { font-size: 12px; color: #7b8794; margin-top: 6px; }
  .dates { font-family: ui-monospace, Menlo, monospace; font-size: 13px;
           white-space: pre-wrap; margin-top: 6px; }
  a { color: #0f4c81; }
</style>
</head>
<body>
<header>
  <h1>站名归一 · 别名映射发布</h1>
  <p>上传全量别名映射后整份替换。未锁定日期会从每行原始站名重算;已锁定日期的源行、可选站名与已发布加噪结果保持原状。</p>
</header>
<main>
  <section>
    <h2>① 当前生效映射</h2>
    <div class="badges" id="mapBadges"></div>
    <table id="mapTable">
      <thead><tr><th>别名</th><th>标准站名</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="hint" id="mapEmpty">尚未发布任何映射;原始站名即作为标准站名。</div>
  </section>

  <section>
    <h2>② 发布新的全量映射(CSV:别名, 标准站名)</h2>
    <form id="mapForm">
      <label for="mapFile">CSV 文件(UTF-8,全量;别名唯一,标准站名不能再作为别名)</label>
      <input type="file" id="mapFile" accept=".csv,text/csv" required>
      <button type="submit" id="mapBtn">上传并发布</button>
    </form>
    <div class="msg" id="mapMsg"></div>
    <div class="hint">发布与重算在同一事务中完成;映射无效或发布失败时原映射与数据保持不变。</div>
  </section>

  <section>
    <h2>③ 最近一次发布结果</h2>
    <div id="publishResult" class="muted">尚无发布记录。</div>
  </section>

  <section>
    <h2>④ 导航</h2>
    <div><a href="/">← 返回客流查询页</a></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);

function showMsg(text, ok) {
  const el = $("mapMsg");
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "err");
}

function renderDates(title, dates, emptyText) {
  const div = document.createElement("div");
  div.innerHTML = `<strong>${title}</strong>`;
  const list = document.createElement("div");
  list.className = "dates";
  list.textContent = dates.length ? dates.join("\n") : emptyText;
  div.appendChild(list);
  return div;
}

async function refreshMapping() {
  const res = await fetch("/api/mapping");
  const data = await res.json();
  if (!data.ok) return;
  $("mapBadges").innerHTML =
    `<span class="badge">当前版本:v${data.version}</span>` +
    `<span class="badge">别名条数:${data.alias_count}</span>` +
    (data.updated_at ? `<span class="badge">发布时间(UTC):${data.updated_at}</span>` : "");
  const tbody = $("mapTable").querySelector("tbody");
  tbody.innerHTML = "";
  for (const e of data.entries) {
    const tr = document.createElement("tr");
    const a = document.createElement("td"); a.textContent = e.alias;
    const c = document.createElement("td"); c.textContent = e.canonical;
    tr.append(a, c);
    tbody.appendChild(tr);
  }
  $("mapEmpty").style.display = data.entries.length ? "none" : "block";
}

$("mapForm").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData();
  fd.append("file", $("mapFile").files[0]);
  $("mapBtn").disabled = true;
  try {
    const res = await fetch("/mapping/publish", { method: "POST", body: fd });
    const data = await res.json();
    if (!data.ok) {
      showMsg("发布失败:" + data.error, false);
      return;
    }
    showMsg(data.message, true);
    const box = $("publishResult");
    box.className = "";
    box.innerHTML = "";
    box.appendChild(renderDates(
      "归一结果有变化、已重算的日期:", data.changed_dates, "(无)"));
    box.appendChild(renderDates(
      "已重算但归一结果未变的未锁定日期:", data.affected_dates, "(无)"));
    box.appendChild(renderDates(
      "已锁定、按规则跳过的日期(源行/可选站名/已发布结果保持原状):",
      data.locked_dates, "(无)"));
    box.appendChild(renderDates(
      "其中若重算本会变化、但仍保持原状的锁定日期:",
      data.skipped_changed_dates, "(无)"));
    refreshMapping();
  } finally {
    $("mapBtn").disabled = false;
  }
});

refreshMapping();
</script>
</body>
</html>
